name: post-merge release

# §9.5 auto-cut + §9.3 latest-on-promotion. Reacts to a merged PR:
#   - into `staging` while a soak is open  -> re-cut a fresh alpha (the installer under
#     test must always match staging's HEAD). Strictly during a soak; NEVER to bridge.
#   - the `staging -> bridge` promotion PR  -> cut the LATEST release from `bridge`.
#
# Both just dispatch `release staging` (release.yml) with the right channel — which
# works on GITHUB_TOKEN because workflow_dispatch is exempt from the recursion guard.
#
# CODE-GATED: an automatic build only fires when the merged PR actually touches buildable
# code (overlay/, the Java bridge, gradle). A docs/CI/markdown-only change produces a
# byte-identical app, so cutting a release would be a no-op "update" — skipped here. Fail-safe:
# any file outside the non-buildable set counts as code. (A *manual* release.yml dispatch is
# never gated — you press it, it always builds.)
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write # check for an open soak issue; close it when the promotion lands
  actions: write # dispatch release.yml
  pull-requests: write # thaw the soak freeze (arm held agent PRs after promotion)

# Serialize (not coalesce) runs per base branch: cancel-in-progress:false queues rather
# than merges bursts, so each PR still gets its own run. release.yml's own concurrency
# guard is what actually prevents two same-channel releases from colliding on a tag.
concurrency:
  group: post-merge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  recut-alpha:
    # A merge into staging, while a soak is open, re-cuts the alpha.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Re-cut the alpha if a soak is in progress
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Returns 0 if the merged PR touches buildable code, 1 if it's all non-buildable
          # (.github, docs, markdown, root config). Fail-safe: on any doubt (no file list, or
          # any file outside the set), treat it as code and build.
          has_code_changes() {
            local files f
            # Fail-safe: only evaluate a COMPLETE list. If the (paginated) fetch fails or is
            # cut short — non-zero exit — build rather than risk skipping a real release.
            if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/files" -q '.[].filename' 2>/dev/null)"; then
              return 0
            fi
            [ -z "$files" ] && return 0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/*|docs/*|*.md|.gitignore|.gitattributes|.editorconfig|LICENSE) ;;
                *) return 0 ;;
              esac
            done <<< "$files"
            return 1
          }
          OPEN="$(gh issue list --repo "$REPO" --state open --label soak --json number -q 'length')"
          if [ "${OPEN:-0}" -eq 0 ]; then
            echo "No soak open — nothing to re-cut (auto-cut is strictly during a soak)."
            exit 0
          fi
          if has_code_changes; then
            echo "Soak in progress ($OPEN open) + buildable code changed — re-cutting the alpha."
            gh workflow run release.yml --repo "$REPO" --ref staging -f channel=alpha
          else
            echo "Soak in progress, but PR #$PR_NUM is docs/CI-only — installer is unchanged, not re-cutting."
          fi

  label-completed:
    # A feature/fix PR merging into staging finishes an agent's work: flip the issue(s)
    # it closes from agent:in-progress -> agent:completed. The issue itself does NOT
    # auto-close here — GitHub's `Closes #N` only fires on the DEFAULT branch (bridge) —
    # so this label is the "agent finished, now soaking" signal during that window.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Flag closed issues agent:completed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # GitHub only populates closingIssuesReferences for PRs targeting the DEFAULT
          # branch (bridge); on a staging PR it's empty (verified), so parse the closing
          # keyword from the PR body ourselves — works regardless of target branch.
          BODY="$(gh pr view "$PR_NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null || true)"
          ISSUES="$(printf '%s\n' "$BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)"
          # Self-create the label (a bare --add-label silently no-ops if it's missing),
          # matching fixloop.yml's ensure_label convention.
          gh label create "agent:completed" --repo "$REPO" --color 0E8A16 \
            --description "Agent's PR for this issue merged to staging (soaking)" >/dev/null 2>&1 || true
          for N in $ISSUES; do
            # Only transition issues actually agent-dispatched (carry agent:in-progress) —
            # don't stamp agent:completed on a human-closed issue.
            HAS="$(gh issue view "$N" --repo "$REPO" --json labels -q '.labels[].name' 2>/dev/null \
              | grep -Fx 'agent:in-progress' || true)"
            [ -z "$HAS" ] && { echo "#$N not agent:in-progress — skipping."; continue; }
            gh issue edit "$N" --repo "$REPO" --add-label "agent:completed" >/dev/null 2>&1 || true
            gh issue edit "$N" --repo "$REPO" --remove-label "agent:in-progress" >/dev/null 2>&1 || true
            echo "#$N: agent:in-progress -> agent:completed."
          done

  cut-latest:
    # The staging -> bridge promotion landing cuts the LATEST release.
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'bridge' &&
      github.event.pull_request.head.ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Cut the latest release (promotion landed on bridge)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Returns 0 if the promotion touches buildable code, 1 if it's all non-buildable.
          # Fail-safe: on any doubt (no file list, or any file outside the set), build.
          has_code_changes() {
            local files f
            # Fail-safe: only evaluate a COMPLETE list. If the (paginated) fetch fails or is
            # cut short — non-zero exit — build rather than risk skipping a real release.
            if ! files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/files" -q '.[].filename' 2>/dev/null)"; then
              return 0
            fi
            [ -z "$files" ] && return 0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/*|docs/*|*.md|.gitignore|.gitattributes|.editorconfig|LICENSE) ;;
                *) return 0 ;;
              esac
            done <<< "$files"
            return 1
          }
          # Cut the latest release ONLY if the promotion carries buildable code — a docs/CI-only
          # promotion yields a byte-identical app (a no-op "update" for users). The cleanup below
          # runs either way: the promotion landed, so the soak is done and the freeze must lift.
          if has_code_changes; then
            echo "Promotion #$PR_NUM has buildable code — cutting the latest release (beta channel)."
            # Guarded so a dispatch failure can't abort before the close+thaw.
            gh workflow run release.yml --repo "$REPO" --ref bridge -f channel=beta \
              || echo "::warning::Could not dispatch the latest (beta) release — re-run 'release staging' (beta) manually. Cleanup continues."
            RELEASE_MSG="Cutting the latest release."
          else
            echo "Promotion #$PR_NUM is docs/CI-only — skipping the latest release (no app-code change)."
            RELEASE_MSG="No app code changed, so no new release was cut."
          fi
          # Capture the cleanup lists FIRST, each guarded with `|| true`. These run under
          # `set -euo pipefail`, so a transient `gh list` failure inside a `... | while` would
          # abort the step and skip the thaw — re-introducing the exact wedge the deferred
          # close exists to avoid (soak left open → §9.5 freeze persists → staging frozen).
          OPEN_SOAKS="$(gh issue list --repo "$REPO" --state open --label soak --json number -q '.[].number' 2>/dev/null || true)"
          HELD_PRS="$(gh pr list --repo "$REPO" --base staging --state open \
            --json number,headRefName,autoMergeRequest \
            -q '.[] | select((.headRefName|startswith("claude/")) and .autoMergeRequest==null) | .number' 2>/dev/null || true)"
          # Close the passing soak issue(s) — deferred from soak:pass so the freeze stayed
          # active through the promotion window (a failed promotion must not leave the loop
          # wedged with no tracking issue). Should be exactly one open.
          for I in $OPEN_SOAKS; do
            gh issue comment "$I" --repo "$REPO" --body "✅ Promotion landed on \`bridge\` — soak complete. $RELEASE_MSG" >/dev/null 2>&1 || true
            gh issue close "$I" --repo "$REPO" >/dev/null 2>&1 || true
          done
          # Thaw the soak freeze (§9.5): arm any held (un-armed) agent PRs into staging. Ones
          # not yet green just wait on branch protection.
          for P in $HELD_PRS; do
            gh pr merge "$P" --repo "$REPO" --squash --auto >/dev/null 2>&1 \
              || echo "::warning::Could not arm auto-merge on held PR #$P during thaw (conflict/ineligible) — it re-arms on its next ci/review completion."
          done
          echo "Thawed held agent PRs (if any)."
