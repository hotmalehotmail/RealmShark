name: implement

# Kickoff bridge (full-spec §02). When a maintainer labels an issue
# `agent:build` (feature) or `agent:fix` (bug), fire the build-agent Routine on
# Anthropic's cloud via its API trigger, passing the issue as the work item, and
# comment the watchable session link back on the issue.
#
# Why a bridge: Claude Code Routines' native GitHub triggers only support
# pull_request/release events — not issues — so we detect the labeled issue here
# (only maintainers can apply labels on a public repo, which is the gate) and
# fire the routine over its HTTP /fire endpoint.
#
# Setup (one-time): create the routine at https://claude.ai/code/routines with an
# API trigger, then add these two repo secrets:
#   ROUTINE_FIRE_URL   — the routine's per-routine /fire endpoint URL
#   ROUTINE_FIRE_TOKEN — the bearer token generated for that trigger
# See docs/build-agent-routine.md for the full walkthrough and the routine prompt.
on:
  issues:
    types: [labeled]

permissions:
  issues: write # to comment the session link (or a setup hint) back on the issue

jobs:
  dispatch:
    if: github.event.label.name == 'agent:build' || github.event.label.name == 'agent:fix'
    runs-on: ubuntu-latest
    steps:
      - name: Fire the build-agent routine
        env:
          # Untrusted issue fields go through env vars (never interpolated into
          # the script body) to avoid shell injection.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABEL: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${FIRE_URL:-}" ] || [ -z "${FIRE_TOKEN:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "⚙️ \`$LABEL\` applied, but the build-agent routine isn't wired up yet (missing ROUTINE_FIRE_URL / ROUTINE_FIRE_TOKEN secrets). See docs/build-agent-routine.md."
            exit 0
          fi
          # The PR CONTRACT block is load-bearing: `Closes #N` is enforced by the
          # `pr hygiene` required check (hygiene.yml) — a PR born without it sits
          # blocked until the body is fixed — and the duplicate check prevents the
          # mis-routed-session class of failure (a second full implementation opened
          # next to an existing open PR; see hygiene.yml's duplicate guard, which
          # backstops this instruction deterministically).
          TEXT="$(printf 'Work item from GitHub issue #%s in %s (label: %s).\nTitle: %s\n\nPR CONTRACT (gate-enforced): make the FIRST line of your PR body exactly `Closes #%s` — the `pr hygiene` required check fails the PR without it. BEFORE writing any code: search this repo'\''s OPEN pull requests for one whose body already closes issue #%s; if one exists, the work is already delivered — do NOT build again and do NOT open a second PR; stop and report that instead.\n\n%s' \
            "$ISSUE_NUMBER" "$REPO" "$LABEL" "$ISSUE_TITLE" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "${ISSUE_BODY:-}")"
          # Compact JSON body written to a file (a jq failure aborts under set -e,
          # unlike BODY=$(jq ...)); --data @file sends exactly these bytes.
          jq -nc --arg t "$TEXT" '{text: $t}' > /tmp/fire.json
          RESP="$(curl -sS -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            --data @/tmp/fire.json)"
          # `|| true` so a non-JSON response doesn't abort the step under set -e
          # before the else-branch can report it.
          URL="$(printf '%s' "$RESP" | jq -r '.claude_code_session_url // empty' 2>/dev/null || true)"
          if [ -n "$URL" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "🤖 Build agent started for this issue — [watch the session]($URL)."
            # Mark the issue actively worked so the issue list reflects agent state. Only
            # on a successful fire (this branch) — a failed dispatch must not read "working".
            # Self-create the label first (a bare --add-label silently no-ops if it's
            # missing), matching fixloop.yml's ensure_label convention.
            gh label create "agent:in-progress" --repo "$REPO" --color FBCA04 \
              --description "An agent is actively working this issue" >/dev/null 2>&1 || true
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "agent:in-progress" >/dev/null 2>&1 || true
          else
            # Build the comment with printf so no YAML indentation leaks into the
            # rendered markdown (which would break the code fence).
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
              --body "$(printf '⚠️ Could not start the build agent. Routine response:\n```\n%s\n```' "$RESP")"
            exit 1
          fi
