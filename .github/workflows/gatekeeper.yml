name: gatekeeper

# Auto-merge agent PRs into staging once ci + review are green (full-spec §02, §7).
#
# Triggers on the COMPLETION of the ci/review workflows. workflow_run fires
# regardless of which token produced the checks (unlike pull_request_review, which
# GitHub's recursion guard would suppress for the GITHUB_TOKEN-posted review) — so
# no GATEKEEPER_TOKEN / PAT is needed; the built-in token suffices.
#
# For a green, mergeable PR it ARMS GitHub native auto-merge and lets branch
# protection do the final "wait for green, then merge". A PR that CONFLICTS with
# staging is NOT this workflow's problem anymore: a conflicted PR emits no ci/review
# runs at all (GitHub can't build its merge ref), so a workflow_run trigger
# structurally cannot drive conflict recovery — conflict-watch.yml owns the rebase
# FIX-MODE re-fire (§6.5), on the events a conflict actually produces, with its own
# MAX_REBASE_ROUNDS budget separate from the fix loop's review rounds.
# INTERLOCK (docs/dev-loop-mechanisms.md §session-interlock): the gatekeeper also refuses
# to arm until the authoring agent session has TERMINATED, proven by a `session-done/<head-sha>`
# marker branch a SessionEnd hook pushes (.claude/hooks/session-done-marker.sh). This closes
# the PR #115 race where auto-merge fired while the fix agent was still running and later
# pushed a correction to the merged branch. Two extra triggers below serve it: `push` to
# session-done/** wakes arming the moment a session ends (even after review already passed —
# the exact #115 timing), and `pull_request: synchronize` DISARMS when the head moves to a
# not-yet-marked commit, so native auto-merge (which, once armed, merges any future green
# head) can never merge a head whose authoring session is still running.
on:
  workflow_run:
    workflows: [ci, review]
    types: [completed]
  push:
    branches: ['session-done/**'] # a SessionEnd marker landing -> (re)evaluate arming
  pull_request:
    types: [synchronize] # head moved -> disarm until the new head has a marker
  issue_comment:
    types: [created] # a session-triaged marker comment -> (re)evaluate arming (triage gate, §7.3)

# Serialize with the fix loop / resume, which re-fire the agent and read the same marker
# count and so must not run concurrently on one PR. Group key falls back across the four
# triggers: workflow_run -> reviewed branch; pull_request -> PR head ref; issue_comment ->
# PR number; push(marker) -> the marker ref name. The workflow_run and pull_request paths
# key on the head branch (matching fixloop.yml / resume.yml). The issue_comment and push
# paths only ARM native auto-merge (never re-fire an agent) and arming is idempotent, so
# keying them differently is harmless — they intentionally do not serialize with re-fires.
concurrency:
  group: fixloop-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.issue.number || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # native auto-merge creates the squash commit
  statuses: read # read the review-verdict status (NOT covered by contents; unlisted scopes default to none)
  issues: write # freeze label + escalation comment on a stuck conflict
  pull-requests: write # to enable auto-merge / comment

jobs:
  gate:
    runs-on: ubuntu-latest
    # Only same-repo agent branches, across the three triggers. Fork PRs are excluded
    # (same-repo checks); a fork's pull_request run gets a read-only token anyway.
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'claude/')) ||
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/heads/session-done/')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'claude/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '<!-- session-triaged:'))
    steps:
      - name: Arm auto-merge, or drive the rebase FIX MODE on a conflict
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PAT: ${{ secrets.MERGE_PAT }}
          REPO: ${{ github.repository }}
          MAINTAINER: ${{ vars.MAINTAINER_HANDLE }}
          # Raw per-trigger fields; the script resolves HEAD/SHA from whichever fired.
          EVT: ${{ github.event_name }}
          WR_HEAD: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          PUSH_REF: ${{ github.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # ---- Resolve which PR/head this run concerns, across the three triggers. ----
          case "$EVT" in
            workflow_run) HEAD="$WR_HEAD"; SHA="$WR_SHA" ;;
            pull_request) HEAD="$PR_HEAD_REF"; SHA="$PR_HEAD_SHA" ;;
            issue_comment)
              # A session-triaged marker comment landed. Resolve the PR it's on.
              HEAD="$(gh pr view "$ISSUE_NUM" --repo "$REPO" --json headRefName -q '.headRefName' 2>/dev/null || true)"
              SHA="$(gh pr view "$ISSUE_NUM" --repo "$REPO" --json headRefOid -q '.headRefOid' 2>/dev/null || true)"
              if [ -z "$HEAD" ] || ! printf '%s' "$HEAD" | grep -q '^claude/'; then
                echo "session-triaged comment is not on a claude/* PR; nothing to do."
                exit 0
              fi ;;
            push)
              # refs/heads/session-done/<sha> -> the sha; act only if it is some open PR's
              # CURRENT head (a stale marker for a since-superseded head matches nothing).
              SHA="${PUSH_REF#refs/heads/session-done/}"
              HEAD="$(gh pr list --repo "$REPO" --base staging --state open \
                        --json headRefName,headRefOid \
                        -q ".[] | select(.headRefOid==\"$SHA\") | .headRefName" 2>/dev/null | head -n1 || true)"
              if [ -z "$HEAD" ]; then
                echo "session-done marker $SHA is not any open claude/* -> staging PR's current head; nothing to arm (orphan marker; sweep GCs it)."
                exit 0
              fi ;;
          esac

          # ---- pull_request synchronize: the head just moved. Preserve the interlock
          #      invariant "auto-merge is armed only while the current head has a marker":
          #      if the PR is armed and the new head has no session-done marker yet (its
          #      authoring session hasn't ended), DISARM. Re-arming happens when the marker
          #      lands (push trigger) or ci/review completes (workflow_run). This closes the
          #      window native auto-merge's persistent arming would otherwise leave open. ----
          if [ "$EVT" = "pull_request" ]; then
            SNUM="$(gh pr list --repo "$REPO" --head "$HEAD" --base staging --state open --json number -q '.[0].number' 2>/dev/null || true)"
            if [ -z "$SNUM" ] || [ "$SNUM" = "null" ]; then
              echo "No open claude/* -> staging PR for $HEAD; nothing to do."
              exit 0
            fi
            ARMED="$(gh pr view "$SNUM" --repo "$REPO" --json autoMergeRequest -q '.autoMergeRequest // "null"' 2>/dev/null || echo null)"
            if [ "$ARMED" != "null" ] && ! gh api "repos/$REPO/git/ref/heads/session-done/$SHA" >/dev/null 2>&1; then
              echo "PR #$SNUM head moved to $SHA with no session-done marker — disabling auto-merge until the session ends."
              gh pr merge "$SNUM" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
            else
              echo "PR #$SNUM synchronize: no disarm needed (armed=$ARMED)."
            fi
            exit 0
          fi

          # The open agent PR for this head branch, targeting staging, plus its mergeability.
          PR="$(gh pr list --repo "$REPO" --head "$HEAD" --base staging --state open \
                  --json number,labels,autoMergeRequest,mergeable -q '.[0]')"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open claude/* -> staging PR for $HEAD; nothing to do."
            exit 0
          fi
          NUM="$(printf '%s' "$PR" | jq -r '.number')"
          MERGEABLE="$(printf '%s' "$PR" | jq -r '.mergeable')" # MERGEABLE | CONFLICTING | UNKNOWN

          # ---- Frozen-PR recovery (audit H4). A PR the fix loop escalated carries
          #      `agent:needs-human`. It recovers on its own the moment it is GREEN AGAIN —
          #      a human pushed fixes (the escalation comment tells them to) or a re-review
          #      flipped the verdict — so clear the freeze and fall through to the normal
          #      arming path. This is the auto-clear the mechanisms doc §6.3(b) promised; it
          #      lives HERE, not in review.yml (which never removed the label). A still-failing
          #      or still-conflicting frozen PR stays frozen for the human, so the automated
          #      loop can never quietly escape its own escalation. ----
          if printf '%s' "$PR" | jq -e '.labels[]? | select(.name == "agent:needs-human")' >/dev/null; then
            RVERDICT="$(gh api "repos/$REPO/commits/$SHA/status" \
                         -q '.statuses[] | select(.context=="review-verdict") | .state' 2>/dev/null | head -n1 || true)"
            if [ "$RVERDICT" != "success" ] || [ "$MERGEABLE" = "CONFLICTING" ] || [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "PR #$NUM is frozen (agent:needs-human); review-verdict='${RVERDICT:-absent}', mergeable='$MERGEABLE' — leaving it for a human."
              exit 0
            fi
            echo "PR #$NUM was frozen but is green again (review-verdict=success, mergeable) — clearing agent:needs-human and resuming the auto-merge gate."
            gh pr edit "$NUM" --repo "$REPO" --remove-label "agent:needs-human" >/dev/null 2>&1 || true
            [ -n "${MAINTAINER:-}" ] && gh pr edit "$NUM" --repo "$REPO" --remove-assignee "$MAINTAINER" >/dev/null 2>&1 || true
            # Reverse the escalation's issue mirror (§6.2): the work is active again, not stalled.
            RBODY="$(gh pr view "$NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null || true)"
            for ISS in $(printf '%s\n' "$RBODY" \
                | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
                | grep -oE '[0-9]+' | sort -u || true); do
              gh issue edit "$ISS" --repo "$REPO" --remove-label "agent:needs-human" >/dev/null 2>&1 || true
              gh issue edit "$ISS" --repo "$REPO" --add-label "agent:in-progress" >/dev/null 2>&1 || true
            done
            gh pr comment "$NUM" --repo "$REPO" --body "✅ Green again (review-verdict passed) — cleared \`agent:needs-human\` and re-entered the auto-merge gate. <!-- gatekeeper:unfreeze -->"
            # fall through to the soak-freeze check + arming below (no exit). NOTE the freeze
            # is genuinely cleared here; the arming itself still defers if a soak is open and
            # this isn't a soak-fix — hence "re-entered the gate", not "armed".
          fi

          # ---- Soak freeze (§9.5). While a soak is open, HOLD unrelated agent PRs (do
          #      nothing) so the soak converges instead of livelocking under merge traffic.
          #      Exempt soak-fix PRs — those whose body references the open soak issue (the
          #      soak:fail brief tells the agent to). Held PRs are armed when the promotion
          #      lands (post-merge.yml thaw). ----
          OPEN_SOAKS="$(gh issue list --repo "$REPO" --state open --label soak --json number -q '.[].number' 2>/dev/null || true)"
          if [ -n "$OPEN_SOAKS" ]; then
            SOAKFIX=0
            # Primary signal: the workflow-defined `soak-fix` label (the soak:fail brief tells the
            # agent to apply it). A discrete label the loop owns is robust against the free-text
            # phrasing drift a body-only match would suffer.
            if printf '%s' "$PR" | jq -e '.labels[]? | select(.name == "soak-fix")' >/dev/null; then
              SOAKFIX=1
            else
              # Fallback: the PR body references the open soak ("Addresses soak #N"), in case the
              # label wasn't applied. Known limitation: only *currently-open* soak numbers match —
              # a second fix PR referencing a superseded soak is held until the soak fully resolves
              # (narrow, off the brief's "open ONE fix PR" happy path). The `\b` (not a bare "#N")
              # avoids exempting an unrelated PR that references an issue of the same number.
              BODY="$(gh pr view "$NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null || true)"
              for S in $OPEN_SOAKS; do
                if printf '%s' "$BODY" | grep -qiE "addresses soak #${S}\b"; then SOAKFIX=1; break; fi
              done
            fi
            if [ "$SOAKFIX" -eq 0 ]; then
              echo "Soak in progress — holding PR #$NUM (not a soak-fix); it is armed when the soak resolves."
              exit 0
            fi
            echo "PR #$NUM is a soak-fix (soak-fix label or soak reference) — not frozen."
          fi

          # ---- Not conflicted: arm native auto-merge (the §7 happy path). ----
          if [ "$MERGEABLE" != "CONFLICTING" ]; then
            if [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "PR #$NUM mergeability still computing — will re-evaluate on the next run."
              exit 0
            fi
            if [ "$(printf '%s' "$PR" | jq -r '.autoMergeRequest // "null"')" != "null" ]; then
              echo "PR #$NUM already has auto-merge armed; nothing to do."
              exit 0
            fi
            # ---- Interlock gate (docs §session-interlock, PR #115). Do NOT arm until the
            #      authoring session has TERMINATED, evidenced by a session-done marker for
            #      the PR's CURRENT head. Native auto-merge, once armed, merges any future
            #      green head, so arming a head whose session is still running is exactly the
            #      race we close. No marker -> hold; the marker's own push re-triggers arming,
            #      and a since-moved head is disarmed by the synchronize path above. (For the
            #      push trigger the marker existence is already implied — we matched it to the
            #      head — but re-checking the CURRENT head is correct and cheap.) ----
            PR_HEAD_OID="$(gh pr view "$NUM" --repo "$REPO" --json headRefOid -q '.headRefOid' 2>/dev/null || true)"
            if [ -z "$PR_HEAD_OID" ] || ! gh api "repos/$REPO/git/ref/heads/session-done/$PR_HEAD_OID" >/dev/null 2>&1; then
              echo "PR #$NUM: no session-done marker for current head ${PR_HEAD_OID:-unknown} — authoring session not finished; holding (the marker push will re-trigger arming)."
              exit 0
            fi
            echo "PR #$NUM: session-done marker present for head $PR_HEAD_OID — session finished."
            # ---- Triage gate (docs §7.3; Q2 = the agent's call is final). A PASSING review
            #      can still carry medium/low findings, which never fail the verdict and so were
            #      historically never acted on. Require, when the current head has such findings,
            #      that they were triaged — the agent fixed the worthwhile ones or replied to
            #      decline the rest, then posted a `session-triaged: <head>` marker comment (or
            #      the fix loop auto-accepted once its triage budget was spent). First ensure the
            #      current head's review is COMPLETE (verdict=success on THIS sha) so the finding
            #      count is stable, not mid-flight. ----
            RV="$(gh api "repos/$REPO/commits/$PR_HEAD_OID/status" -q '.statuses[] | select(.context=="review-verdict") | .state' 2>/dev/null | head -n1 || true)"
            if [ "$RV" != "success" ]; then
              echo "PR #$NUM: review-verdict for current head $PR_HEAD_OID is '${RV:-absent}' — review not complete/passed for this sha; holding until it is."
              exit 0
            fi
            # The reviewer's inline comments on THIS head that are MEDIUM-and-up (tagged
            # `**[medium|high|critical]**`; `low` is informational only, never gated — same filter
            # as fixloop). File-level findings with no line anchor live only in the review body — a
            # known, rare gap; they don't gate. Count with ...| .id | wc -l, not `-q length`
            # (miscounts under --paginate).
            FINDINGS="$(gh api --paginate "repos/$REPO/pulls/$NUM/comments" \
                          -q ".[] | select(.user.login==\"github-actions[bot]\" and .commit_id==\"$PR_HEAD_OID\" and (.body | startswith(\"**[low]**\") | not)) | .id" 2>/dev/null | wc -l | tr -d ' ')"
            if [ "${FINDINGS:-0}" -gt 0 ]; then
              if gh api --paginate "repos/$REPO/issues/$NUM/comments" \
                   -q ".[] | select(.body | contains(\"<!-- session-triaged: $PR_HEAD_OID -->\")) | .id" 2>/dev/null | grep -q .; then
                echo "PR #$NUM: $FINDINGS finding(s) on head $PR_HEAD_OID, session-triaged marker present — proceeding to arm."
              else
                echo "PR #$NUM: $FINDINGS unaddressed review finding(s) on head $PR_HEAD_OID and no session-triaged marker — holding for the triage pass (its marker comment re-triggers arming)."
                exit 0
              fi
            fi
            echo "PR #$NUM: gates satisfied — proceeding to arm."
            # --- MERGE_PAT preflight (LOUD). Arm with the PAT (a member identity) so the eventual
            #     merge fires pull_request:closed -> post-merge recut-alpha. A GITHUB_TOKEN merge is
            #     swallowed by the recursion guard, so a silent fallback to it would re-break the
            #     re-cut. If the PAT is missing/expired we FAIL the run instead.
            if [ -z "${MERGE_PAT:-}" ]; then
              echo "::error::MERGE_PAT is empty/unset — required to arm auto-merge. Add the fine-grained PAT (this repo · Contents + Pull requests: R/W) as MERGE_PAT."
              gh pr comment "$NUM" --repo "$REPO" --body "❌ Can't arm auto-merge — the \`MERGE_PAT\` secret is missing. Add it, then re-run ci (or push) to re-trigger." || true
              exit 1
            fi
            if ! GH_TOKEN="$MERGE_PAT" gh api "repos/$REPO/pulls?per_page=1" >/dev/null 2>/tmp/pat_err; then
              echo "::error::MERGE_PAT failed (expired, revoked, or missing Contents/Pull-requests access) — rotate it. gh: $(tr '\n' ' ' </tmp/pat_err)"
              gh pr comment "$NUM" --repo "$REPO" --body "❌ Can't arm auto-merge — \`MERGE_PAT\` failed (expired/revoked/insufficient access). Rotate it; this PR re-arms on its next ci/review run." || true
              exit 1
            fi
            echo "Arming auto-merge on PR #$NUM (via MERGE_PAT)."
            # --auto hands off to native auto-merge; branch protection waits for all required
            # checks (ci + review-verdict) before it actually merges.
            GH_TOKEN="$MERGE_PAT" gh pr merge "$NUM" --repo "$REPO" --squash --auto \
              || echo "::warning::Could not arm auto-merge on #$NUM (ineligible); leaving it."
            exit 0
          fi

          # ---- Conflicted (§6.5): conflict-watch.yml's job, not ours. It fires on the
          #      events a conflicted PR actually emits (pull_request_target + staging
          #      pushes; this workflow_run trigger never fires for a born-DIRTY PR at
          #      all), re-fires the builder's rebase FIX MODE, and owns the separate
          #      MAX_REBASE_ROUNDS budget. Arming is impossible on a DIRTY PR, so
          #      there is nothing for the gatekeeper to do here. ----
          echo "PR #$NUM conflicts with staging — conflict-watch owns the rebase re-fire; nothing to arm."
          exit 0
