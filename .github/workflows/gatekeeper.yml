name: gatekeeper

# Auto-merge agent PRs into staging once ci + review are green (full-spec §02, §7),
# and drive the merge-conflict rebase path (§6.5).
#
# Triggers on the COMPLETION of the ci/review workflows. workflow_run fires
# regardless of which token produced the checks (unlike pull_request_review, which
# GitHub's recursion guard would suppress for the GITHUB_TOKEN-posted review) — so
# no GATEKEEPER_TOKEN / PAT is needed; the built-in token suffices.
#
# For a green, mergeable PR it ARMS GitHub native auto-merge and lets branch
# protection do the final "wait for green, then merge". For an otherwise-green PR
# that CONFLICTS with staging (§6.5) it can't merge, so instead it re-fires the build
# agent in FIX MODE with a rebase instruction — shared with the fix loop's re-fire
# marker and MAX_FIX_ROUNDS budget (§6.1/§6.2), so a conflict that can't be resolved
# escalates to a human rather than looping.
on:
  workflow_run:
    workflows: [ci, review]
    types: [completed]

# Serialize with the fix loop / resume on the same head branch: all three re-fire the
# agent and read the same marker count, so they must not run concurrently on one PR.
concurrency:
  group: fixloop-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write # native auto-merge creates the squash commit
  statuses: read # read the review-verdict status (NOT covered by contents; unlisted scopes default to none)
  issues: write # freeze label + escalation comment on a stuck conflict
  pull-requests: write # to enable auto-merge / comment

jobs:
  gate:
    runs-on: ubuntu-latest
    # Only PR-triggered ci/review runs, and only same-repo agent branches.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    steps:
      - name: Arm auto-merge, or drive the rebase FIX MODE on a conflict
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PAT: ${{ secrets.MERGE_PAT }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_WF: ${{ github.event.workflow_run.name }}
          FIRE_URL: ${{ secrets.ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          MAINTAINER: ${{ vars.MAINTAINER_HANDLE }}
        run: |
          set -euo pipefail
          MAX_FIX_ROUNDS=3 # keep in sync with fixloop.yml / resume.yml

          # The open agent PR for this head branch, targeting staging, plus its mergeability.
          PR="$(gh pr list --repo "$REPO" --head "$HEAD" --base staging --state open \
                  --json number,labels,autoMergeRequest,mergeable -q '.[0]')"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open claude/* -> staging PR for $HEAD; nothing to do."
            exit 0
          fi
          NUM="$(printf '%s' "$PR" | jq -r '.number')"
          MERGEABLE="$(printf '%s' "$PR" | jq -r '.mergeable')" # MERGEABLE | CONFLICTING | UNKNOWN

          # ---- Frozen-PR recovery (audit H4). A PR the fix loop escalated carries
          #      `agent:needs-human`. It recovers on its own the moment it is GREEN AGAIN —
          #      a human pushed fixes (the escalation comment tells them to) or a re-review
          #      flipped the verdict — so clear the freeze and fall through to the normal
          #      arming path. This is the auto-clear the mechanisms doc §6.3(b) promised; it
          #      lives HERE, not in review.yml (which never removed the label). A still-failing
          #      or still-conflicting frozen PR stays frozen for the human, so the automated
          #      loop can never quietly escape its own escalation. ----
          if printf '%s' "$PR" | jq -e '.labels[]? | select(.name == "agent:needs-human")' >/dev/null; then
            RVERDICT="$(gh api "repos/$REPO/commits/$SHA/status" \
                         -q '.statuses[] | select(.context=="review-verdict") | .state' 2>/dev/null | head -n1 || true)"
            if [ "$RVERDICT" != "success" ] || [ "$MERGEABLE" = "CONFLICTING" ] || [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "PR #$NUM is frozen (agent:needs-human); review-verdict='${RVERDICT:-absent}', mergeable='$MERGEABLE' — leaving it for a human."
              exit 0
            fi
            echo "PR #$NUM was frozen but is green again (review-verdict=success, mergeable) — clearing agent:needs-human and resuming the auto-merge gate."
            gh pr edit "$NUM" --repo "$REPO" --remove-label "agent:needs-human" >/dev/null 2>&1 || true
            [ -n "${MAINTAINER:-}" ] && gh pr edit "$NUM" --repo "$REPO" --remove-assignee "$MAINTAINER" >/dev/null 2>&1 || true
            # Reverse the escalation's issue mirror (§6.2): the work is active again, not stalled.
            RBODY="$(gh pr view "$NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null || true)"
            for ISS in $(printf '%s\n' "$RBODY" \
                | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
                | grep -oE '[0-9]+' | sort -u || true); do
              gh issue edit "$ISS" --repo "$REPO" --remove-label "agent:needs-human" >/dev/null 2>&1 || true
              gh issue edit "$ISS" --repo "$REPO" --add-label "agent:in-progress" >/dev/null 2>&1 || true
            done
            gh pr comment "$NUM" --repo "$REPO" --body "✅ Green again (review-verdict passed) — cleared \`agent:needs-human\` and re-entered the auto-merge gate. <!-- gatekeeper:unfreeze -->"
            # fall through to the soak-freeze check + arming below (no exit). NOTE the freeze
            # is genuinely cleared here; the arming itself still defers if a soak is open and
            # this isn't a soak-fix — hence "re-entered the gate", not "armed".
          fi

          # ---- Soak freeze (§9.5). While a soak is open, HOLD unrelated agent PRs (do
          #      nothing) so the soak converges instead of livelocking under merge traffic.
          #      Exempt soak-fix PRs — those whose body references the open soak issue (the
          #      soak:fail brief tells the agent to). Held PRs are armed when the promotion
          #      lands (post-merge.yml thaw). ----
          OPEN_SOAKS="$(gh issue list --repo "$REPO" --state open --label soak --json number -q '.[].number' 2>/dev/null || true)"
          if [ -n "$OPEN_SOAKS" ]; then
            SOAKFIX=0
            # Primary signal: the workflow-defined `soak-fix` label (the soak:fail brief tells the
            # agent to apply it). A discrete label the loop owns is robust against the free-text
            # phrasing drift a body-only match would suffer.
            if printf '%s' "$PR" | jq -e '.labels[]? | select(.name == "soak-fix")' >/dev/null; then
              SOAKFIX=1
            else
              # Fallback: the PR body references the open soak ("Addresses soak #N"), in case the
              # label wasn't applied. Known limitation: only *currently-open* soak numbers match —
              # a second fix PR referencing a superseded soak is held until the soak fully resolves
              # (narrow, off the brief's "open ONE fix PR" happy path). The `\b` (not a bare "#N")
              # avoids exempting an unrelated PR that references an issue of the same number.
              BODY="$(gh pr view "$NUM" --repo "$REPO" --json body -q '.body' 2>/dev/null || true)"
              for S in $OPEN_SOAKS; do
                if printf '%s' "$BODY" | grep -qiE "addresses soak #${S}\b"; then SOAKFIX=1; break; fi
              done
            fi
            if [ "$SOAKFIX" -eq 0 ]; then
              echo "Soak in progress — holding PR #$NUM (not a soak-fix); it is armed when the soak resolves."
              exit 0
            fi
            echo "PR #$NUM is a soak-fix (soak-fix label or soak reference) — not frozen."
          fi

          # ---- Not conflicted: arm native auto-merge (the §7 happy path). ----
          if [ "$MERGEABLE" != "CONFLICTING" ]; then
            if [ "$MERGEABLE" = "UNKNOWN" ]; then
              echo "PR #$NUM mergeability still computing — will re-evaluate on the next run."
              exit 0
            fi
            if [ "$(printf '%s' "$PR" | jq -r '.autoMergeRequest // "null"')" != "null" ]; then
              echo "PR #$NUM already has auto-merge armed; nothing to do."
              exit 0
            fi
            # --- MERGE_PAT preflight (LOUD). Arm with the PAT (a member identity) so the eventual
            #     merge fires pull_request:closed -> post-merge recut-alpha. A GITHUB_TOKEN merge is
            #     swallowed by the recursion guard, so a silent fallback to it would re-break the
            #     re-cut. If the PAT is missing/expired we FAIL the run instead.
            if [ -z "${MERGE_PAT:-}" ]; then
              echo "::error::MERGE_PAT is empty/unset — required to arm auto-merge. Add the fine-grained PAT (this repo · Contents + Pull requests: R/W) as MERGE_PAT."
              gh pr comment "$NUM" --repo "$REPO" --body "❌ Can't arm auto-merge — the \`MERGE_PAT\` secret is missing. Add it, then re-run ci (or push) to re-trigger." || true
              exit 1
            fi
            if ! GH_TOKEN="$MERGE_PAT" gh api "repos/$REPO/pulls?per_page=1" >/dev/null 2>/tmp/pat_err; then
              echo "::error::MERGE_PAT failed (expired, revoked, or missing Contents/Pull-requests access) — rotate it. gh: $(tr '\n' ' ' </tmp/pat_err)"
              gh pr comment "$NUM" --repo "$REPO" --body "❌ Can't arm auto-merge — \`MERGE_PAT\` failed (expired/revoked/insufficient access). Rotate it; this PR re-arms on its next ci/review run." || true
              exit 1
            fi
            echo "Arming auto-merge on PR #$NUM (via MERGE_PAT)."
            # --auto hands off to native auto-merge; branch protection waits for all required
            # checks (ci + review-verdict) before it actually merges.
            GH_TOKEN="$MERGE_PAT" gh pr merge "$NUM" --repo "$REPO" --squash --auto \
              || echo "::warning::Could not arm auto-merge on #$NUM (ineligible); leaving it."
            exit 0
          fi

          # ---- Conflicted (§6.5). ----
          # This job fires on BOTH `ci` and `review` completion (to arm auto-merge on
          # either). But the rebase re-fire must happen ONCE per PR state, so gate it to
          # the `review` completion only — otherwise one push would fire two rebases.
          # (Arming above is idempotent, so it's fine on both.)
          if [ "$EVENT_WF" != "review" ]; then
            echo "PR #$NUM conflicts with staging; deferring the rebase to the review-completion run."
            exit 0
          fi

          # Only act when the PR is OTHERWISE green; a failing review is the fix loop's
          # job (it'll re-fire, and the agent's push may resolve the conflict
          # incidentally). Re-firing a rebase on top of a failing review would double-fire
          # and race the shared budget.
          VERDICT="$(gh api "repos/$REPO/commits/$SHA/status" \
                       -q '.statuses[] | select(.context=="review-verdict") | .state' 2>/dev/null | head -n1 || true)"
          if [ "$VERDICT" != "success" ]; then
            echo "PR #$NUM conflicts with staging but review-verdict is '${VERDICT:-absent}' — the fix loop owns it; not rebasing."
            exit 0
          fi

          # Shared budget: count the fix loop's own re-fire markers (§6.1) — rebase attempts
          # carry the same marker, so review-fix and rebase rounds share MAX_FIX_ROUNDS.
          PRIOR_REFIRES="$(gh api --paginate "repos/$REPO/issues/$NUM/comments" \
                             -q '.[] | select(.user.login=="github-actions[bot]" and (.body|contains("<!-- fixloop:refire -->"))) | .id' \
                             2>/dev/null | wc -l | tr -d ' ')"
          ATTEMPT=$((PRIOR_REFIRES + 1))

          if [ "$PRIOR_REFIRES" -ge "$MAX_FIX_ROUNDS" ]; then
            # Budget spent on an unresolved conflict — freeze for a human (a conflict-specific,
            # lighter escalation than §6.2: auto-merge is already off on a DIRTY PR, and there
            # is no reviewer summary to quote).
            echo "PR #$NUM still conflicts after $PRIOR_REFIRES attempt(s) — escalating."
            gh label create "agent:needs-human" --repo "$REPO" --color "B60205" --description "Agent loop stalled — needs a maintainer" --force >/dev/null 2>&1 || true
            gh pr edit "$NUM" --repo "$REPO" --add-label "agent:needs-human" >/dev/null 2>&1 || true
            MENTION=""; [ -n "${MAINTAINER:-}" ] && MENTION="@$MAINTAINER "
            gh pr comment "$NUM" --repo "$REPO" --body "${MENTION}🛑 **Merge conflict couldn't be auto-resolved** in $MAX_FIX_ROUNDS attempt(s). This PR conflicts with \`staging\` and now needs a manual rebase (\`git merge origin/staging\`, resolve, push), then remove \`agent:needs-human\` (or apply \`agent:retry\`)."
            exit 0
          fi

          # Under budget: re-fire the agent in FIX MODE with a rebase instruction (§6.5).
          if [ -z "${FIRE_URL:-}" ] || [ -z "${FIRE_TOKEN:-}" ]; then
            echo "::warning::PR #$NUM conflicts but ROUTINE_FIRE_* secrets are unset — cannot auto-rebase."
            gh pr comment "$NUM" --repo "$REPO" --body "⚙️ This PR conflicts with \`staging\`, but the fix loop can't re-fire the agent to rebase (missing ROUTINE_FIRE_* secrets). Rebase manually."
            exit 0
          fi
          TEXT="$(printf 'FIX MODE. Repository %s. PR #%s, head branch `%s`, base `staging`.\nThis PR CONFLICTS with `staging`. Check out `%s`, merge `origin/staging` into it, resolve the conflicts, and PUSH to `%s` — do NOT open a new PR. Do not change anything beyond what the conflict resolution requires.' \
            "$REPO" "$NUM" "$HEAD" "$HEAD" "$HEAD")"
          jq -nc --arg t "$TEXT" '{text: $t}' > /tmp/fire.json
          RESP="$(curl -sS -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            --data @/tmp/fire.json || true)"
          URL="$(printf '%s' "$RESP" | jq -r '.claude_code_session_url // empty' 2>/dev/null || true)"
          if [ -n "$URL" ]; then
            # Same marker as fixloop => this counts against the shared MAX_FIX_ROUNDS budget.
            gh pr comment "$NUM" --repo "$REPO" --body "🔀 Conflicts with \`staging\` — re-fired the agent in **FIX MODE** to rebase (attempt $ATTEMPT/$MAX_FIX_ROUNDS). [Watch the session]($URL). <!-- fixloop:refire -->"
          else
            gh pr comment "$NUM" --repo "$REPO" --body "$(printf '⚠️ Tried to auto-rebase the conflict but the FIX MODE re-fire failed. Routine response:\n```\n%s\n```' "$RESP")"
            exit 1
          fi
