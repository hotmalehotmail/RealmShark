name: gatekeeper

# Auto-merge agent PRs into staging once ci + review are green (full-spec §02).
#
# Triggers on the COMPLETION of the ci/review workflows. workflow_run fires
# regardless of which token produced the checks (unlike pull_request_review, which
# GitHub's recursion guard would suppress for the GITHUB_TOKEN-posted review) — so
# no GATEKEEPER_TOKEN / PAT is needed; the built-in token suffices.
#
# It doesn't evaluate the checks itself: it ARMS GitHub native auto-merge on the PR,
# and branch protection (required checks = the two ci jobs + review-verdict) does the
# actual "wait for green, then merge". A failing review-verdict just leaves auto-merge
# waiting (the fix loop, §6, drives re-fires); its escalation sets `agent:needs-human`,
# which this job refuses to re-arm past.
#
# Prereqs (both met): repo "Allow auto-merge" enabled; review-verdict is a required
# check on staging + bridge.
on:
  workflow_run:
    workflows: [ci, review]
    types: [completed]

permissions:
  contents: write # native auto-merge creates the squash commit
  pull-requests: write # to enable auto-merge

jobs:
  arm-auto-merge:
    runs-on: ubuntu-latest
    # Only PR-triggered ci/review runs, and only agent branches.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    steps:
      - name: Arm native auto-merge if the PR is eligible
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The open agent PR for this head branch, targeting staging.
          PR="$(gh pr list --repo "$REPO" --head "$HEAD" --base staging --state open \
                  --json number,labels,autoMergeRequest -q '.[0]')"
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            echo "No open claude/* -> staging PR for $HEAD; nothing to do."
            exit 0
          fi
          NUM="$(printf '%s' "$PR" | jq -r '.number')"
          if printf '%s' "$PR" | jq -e '.labels[]? | select(.name == "agent:needs-human")' >/dev/null; then
            echo "PR #$NUM is frozen (agent:needs-human) — not arming auto-merge."
            exit 0
          fi
          if [ "$(printf '%s' "$PR" | jq -r '.autoMergeRequest // "null"')" != "null" ]; then
            echo "PR #$NUM already has auto-merge armed; nothing to do."
            exit 0
          fi
          echo "Arming auto-merge on PR #$NUM."
          # --auto hands off to native auto-merge; branch protection waits for all
          # required checks (ci + review-verdict) before it actually merges. A conflict
          # (DIRTY) makes this a no-op until resolved — that path is the fix loop's (§6.5).
          gh pr merge "$NUM" --repo "$REPO" --squash --auto \
            || echo "Could not arm auto-merge on #$NUM (likely conflicted/ineligible); leaving it."
