name: ci

# Ground-truth merge gate (full-spec §02, net 1). Runs on every PR into the
# integration/release branches. This is the objective pass/fail that stands in
# for a test suite the repo doesn't have yet.
on:
  pull_request:
    branches: [staging, bridge]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  overlay:
    name: overlay — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overlay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # overlay/package.json engines: node >=22.12.0
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      # --ignore-scripts skips the electron-builder native rebuild (postinstall):
      # typecheck + lint don't need the compiled X11 addon, and the Linux runner
      # lacks the libxcb headers electron-overlay-window wants.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # vitest (overlay/test/: capture-replay regression tests + the allowlist
      # tripwire — see docs/overlay-testing.md). Runs inside this job so the
      # required-check context name (`overlay — typecheck + lint`) is unchanged,
      # same precedent as `gradle test` inside `bridge — compile + fat jar`.
      - run: npm test

  bridge:
    name: bridge — compile + fat jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Pin Gradle 7.4.2 here instead of committing a wrapper jar: the Shadow 7.0.0
      # plugin breaks on Gradle 9, and `gradle/` is gitignored in this repo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4.2
      - run: gradle test        # JUnit DPS tests — the ground-truth net
      - run: gradle bridgeJar

  # Guards against the 2026-07-10 staging-drift incident: review.yml is only "live"
  # when byte-identical to the DEFAULT branch's copy (claude-code-action's guard), so
  # a branch whose review.yml drifts SILENTLY skips reviews (green, no review). This
  # makes that loud. Policy: review.yml changes are legitimate only via a PR into the
  # default branch; anywhere else the merge result must already match the default's.
  workflow-parity:
    name: workflow parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: review.yml must match the default branch
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "$DEFAULT" ]; then
            echo "PR targets the default branch ($DEFAULT); review.yml changes are legitimate here. OK."
            exit 0
          fi
          # Explicit refspec so refs/remotes/origin/$DEFAULT is guaranteed to exist:
          # checkout@v4 uses a narrow PR refspec, so a bare `git fetch origin $DEFAULT`
          # may only move FETCH_HEAD, leaving `origin/$DEFAULT` a "bad revision" (exit
          # 128) — which, as an `if` condition, would masquerade as "differs".
          git fetch --no-tags origin "+refs/heads/$DEFAULT:refs/remotes/origin/$DEFAULT"
          if git diff --quiet "refs/remotes/origin/$DEFAULT" -- .github/workflows/review.yml; then
            echo "review.yml matches origin/$DEFAULT. OK."
          else
            echo "::error::review.yml differs from the default branch ($DEFAULT). A stale review.yml makes claude-code-action silently skip reviews on this branch's PRs. Land review.yml changes via a PR into $DEFAULT, then sync this branch."
            exit 1
          fi
