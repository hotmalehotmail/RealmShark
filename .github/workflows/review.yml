name: review

# Independent agent review (full-spec §02, net 2). Reviews every PR for BOTH
# correctness and code quality, and posts its findings directly onto the PR
# (inline review comments + a summary) — visible feedback, not a no-op.
#
# Auth: a Claude subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN, from
# `claude setup-token`) + the Claude GitHub App. Needs id-token: write.
#
# claude-code-action validates that this file is byte-identical to the copy on
# the default branch before running (a prompt-injection guard), so it does NOT
# review the PR that changes review.yml itself — only PRs opened after it merges.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, bridge]

permissions:
  contents: read
  pull-requests: write
  id-token: write # claude-code-action mints an OIDC token to get its GitHub App token

jobs:
  review:
    name: agent review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action blocks mutating tools by default, so the review couldn't post.
          # Grant only what it needs to read the diff and post: scoped gh/git + file
          # write. NOT arbitrary Bash — this reviews untrusted PR diffs, and the token
          # is limited to contents:read + pull-requests:write, so the blast radius of a
          # prompt-injected gh call is at most a misleading PR comment.
          claude_args: "--model claude-opus-4-8 --allowedTools Bash(gh:*),Bash(git:*),Write,Read,Grep,Glob"
          show_full_output: true
          # Authenticate gh inside Claude's shell so it can post the review.
          settings: |
            { "env": { "GH_TOKEN": "${{ github.token }}" } }
          prompt: |
            You are the code reviewer for pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. Review ONLY what this PR changes.

            Read the diff with:  gh pr diff ${{ github.event.pull_request.number }}
            The repo is checked out — read surrounding files for context, and consult
            CLAUDE.md for the project's conventions and the wire-format contract.

            Review for BOTH, weighting them equally:
            1. Correctness — bugs, wrong logic, unhandled edge cases, race conditions,
               broken contracts (e.g. Java packet fields vs. the TS types that consume them).
            2. Code quality — readability, maintainability, clear naming, right-sized
               abstraction, error handling at boundaries; no magic numbers, dead code, or
               duplicated logic; consistency with existing patterns and CLAUDE.md. The bar
               is: would a careful maintainer be happy to own this code?

            Be coverage-first: surface every real issue with a severity
            (critical / high / medium / low), each tied to a file and line where possible.
            Skip pure formatting that eslint/prettier already handles.

            Then POST the review to the PR (do not just print it). Write /tmp/review.json:
              {
                "event": "COMMENT",
                "body": "<2-4 sentence summary; include any findings not tied to a line>",
                "comments": [
                  { "path": "<file>", "line": <line number in the NEW version of the file>,
                    "body": "**[severity]** <the issue and a concrete suggested fix>" }
                ]
              }
            Only put inline comments on lines that appear in the diff (added/changed lines).
            Post it with:
              gh api --method POST \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                --input /tmp/review.json
            If that call errors (e.g. a line is outside the diff), fall back to posting all
            findings as one comment so nothing is lost:
              gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md
            Always post something — if there are genuinely no issues, post a brief summary
            saying the change looks good.
