name: release staging

# The release pipeline (full-spec §02, §8, §9).
#
# Two channels, same build:
#   alpha  — the SOAK build from `staging`. Manual dispatch starts a soak; while a soak
#            is open, post-merge.yml auto-cuts fresh alphas. patch+1, `-alpha` suffix,
#            published as a PRERELEASE, and opens a soak tracking issue (§9.1).
#   beta   — the LATEST release from `bridge`. Auto-cut by post-merge.yml when a
#            soak:pass promotion lands on `bridge` (§9.3). MINOR bump, no suffix,
#            published as the "Latest" release (not a prerelease). No soak issue.
#
# The manual `workflow_dispatch` is still the human release gate — a soak only ever
# starts because you press it (auto-cut re-releases are continuations of that soak).
# Version auto-bumps from the latest published tag (§8); no manual bump needed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel (alpha = staging soak build; beta = latest release)
        type: choice
        options: [alpha, beta]
        default: alpha

# Serialize releases per channel. Two staging merges close together can each dispatch an
# alpha (post-merge.yml) that seeds from the same latest tag and computes the SAME version
# — the second `gh release create` would then collide on the already-created tag. Queuing
# the second run (cancel-in-progress:false) makes it seed from the just-published tag and
# bump past it instead of racing.
concurrency:
  group: release-${{ github.event.inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # §8 release-notes "captain": a Haiku agent drafts notes from the Conventional
  # Commits since the last tag. Best-effort — every step is non-fatal, so a captain
  # failure never blocks the release; the publish job falls back to a static note.
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # claude-code-action mints an OIDC token for its GitHub App token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags + full history to diff since the last release

      - name: Collect Conventional Commits since the last tag
        id: commits
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi
          echo "last_tag=${LAST_TAG:-(first release)}" >> "$GITHUB_OUTPUT"
          # One bullet per non-merge commit subject -> the captain's raw material.
          git log --no-merges --pretty=format:'- %s' "$RANGE" > "$GITHUB_WORKSPACE/commits.txt" || true
          printf '\n' >> "$GITHUB_WORKSPACE/commits.txt"
          # `grep -c .` exits non-zero on an empty file, so `|| true` (not `|| echo 0`,
          # which would print a second 0 next to grep's own).
          N="$(grep -c . "$GITHUB_WORKSPACE/commits.txt" || true)"
          echo "Collected ${N:-0} commit(s) in range $RANGE."
          # PR list for the soak issue: the content PRs in this build. Squash-merged PRs carry
          # "(#N)" in their subject (GitHub auto-links the number); merge-commit syncs/promotions
          # are intentionally excluded as plumbing. Reuse commits.txt; placeholder if none.
          grep -E '\(#[0-9]+\)' "$GITHUB_WORKSPACE/commits.txt" > "$GITHUB_WORKSPACE/pr-list.md" || true
          [ -s "$GITHUB_WORKSPACE/pr-list.md" ] || echo "_(no pull requests in this build)_" > "$GITHUB_WORKSPACE/pr-list.md"

      - name: Draft release notes (Haiku)
        id: captain
        continue-on-error: true # never block the release on the captain
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow the CI dispatcher bot to run the captain. claude-code-action blocks
          # bot-initiated runs by default; an auto-cut release (post-merge.yml) dispatches
          # release.yml as github-actions[bot], so without this the captain fails with
          # "Workflow initiated by non-human actor" and the release falls back to static
          # notes. Safe: release is only dispatchable by a maintainer or the trusted
          # post-merge auto-cut, and the captain only has Read,Write on commits.txt.
          allowed_bots: "github-actions,github-actions[bot]"
          claude_args: "--model claude-haiku-4-5 --allowedTools Read,Write"
          prompt: |
            Draft concise, user-facing release notes in GitHub-flavored markdown for the
            Thessal overlay "${{ inputs.channel }}" release, covering changes since
            ${{ steps.commits.outputs.last_tag }}.

            The raw Conventional Commits are in commits.txt (read it). Rewrite them into
            short human-readable bullets grouped under **Features** / **Fixes** / **Other**
            (omit an empty group). Drop pure noise (chore/ci/docs/test) unless user-visible,
            drop commit hashes and PR numbers, and keep the whole thing brief.

            Write ONLY the finished notes (no preamble, no surrounding code fence) to the
            file release-notes.md in the repo root.

      - name: Upload drafted notes
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: |
            release-notes.md
            pr-list.md
          if-no-files-found: warn

  build-and-publish:
    # `needs: notes` serializes the Windows build behind the captain. Chosen over
    # running them concurrently: the download step can only see the artifact once the
    # notes job has finished, so a concurrent build could reach it first and silently
    # fall back to static notes. The captain (Haiku) is fast relative to the Windows
    # build, and a release is a rare action, so the added latency is cheap insurance
    # that a successful captain's notes are actually used.
    needs: notes
    if: ${{ !cancelled() }} # publish even if the captain job hiccups (static fallback below)
    permissions:
      contents: write # gh release create
      issues: write # open the soak tracking issue (alpha)
    # Native Windows runner — electron-builder --win is far more reliable here
    # than cross-building from macOS/Linux. Free on public repos.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.4.2
      - name: Build bridge.jar
        run: gradle bridgeJar   # -> build/libs/bridge.jar (electron-builder bundles this)

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # overlay/package.json engines: node >=22.12.0
          cache: npm
          cache-dependency-path: overlay/package-lock.json
      # Full install here (native rebuild included) — the Windows packaging step
      # needs the compiled addon, and windows-latest has the build tools for it.
      - name: Install overlay deps
        working-directory: overlay
        run: npm ci

      - name: Auto-bump the version (channel-aware)
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Seed from the latest published release tag — the record of what's actually
          # shipped — so versions increase monotonically without persisting anything back
          # to a (protected) branch. Fall back to package.json for the very first release.
          LATEST="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName // empty' 2>/dev/null || true)"
          SEED="${LATEST#v}"
          SEED="${SEED:-$(node -p "require('./overlay/package.json').version")}"
          CORE="${SEED%%-*}" # strip any prerelease suffix
          IFS=. read -r MA MI PA <<< "$CORE"
          case "${{ inputs.channel }}" in
            # LATEST release: a bigger (minor) bump, no prerelease suffix. 0.9.29-alpha -> 0.10.0
            beta) NEW="${MA}.$((MI + 1)).0" ;;
            # SOAK build: patch bump, -alpha suffix. 0.9.27-alpha -> 0.9.28-alpha
            *)    NEW="${MA}.${MI}.$((PA + 1))-alpha" ;;
          esac
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          # Write it into package.json so the built app (app.getVersion) + installer name
          # carry it. NEW is computed (semver chars only) — safe to interpolate.
          node -e "const fs=require('fs'),f='overlay/package.json',p=JSON.parse(fs.readFileSync(f));p.version='$NEW';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          echo "Auto-bumped ${SEED} -> ${NEW} (channel ${{ inputs.channel }}, seed: ${LATEST:-package.json})."

      - name: Build + package (Windows x64)
        working-directory: overlay
        run: |
          npm run build
          npx electron-builder --win --x64   # -> overlay/dist/realmshark-overlay-<version>-setup.exe

      - name: Download drafted notes
        continue-on-error: true # fall back to static notes if the captain produced none
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.v.outputs.version }}"
          # alpha -> prerelease; beta -> the "Latest" release (not a prerelease).
          if [ "${{ inputs.channel }}" = "beta" ]; then RELFLAG="--latest"; else RELFLAG="--prerelease"; fi
          # The updater matches assets by /-setup\.exe$/i, which the electron-builder
          # artifact name already satisfies — no rename needed.
          NOTES_FILE="notes/release-notes.md"
          if [ -s "$NOTES_FILE" ]; then
            NOTESARG=(--notes-file "$NOTES_FILE")
          else
            NOTESARG=(--notes "Automated ${{ inputs.channel }} build from ${{ github.ref_name }}.")
          fi
          gh release create "$TAG" $RELFLAG \
            --title "Overlay $TAG (${{ inputs.channel }})" \
            "${NOTESARG[@]}" \
            overlay/dist/*-setup.exe build/libs/bridge.jar
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Open the soak tracking issue (alpha only)
        if: ${{ inputs.channel == 'alpha' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          REL_URL: ${{ steps.publish.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="notes/release-notes.md"
          if [ -s "$NOTES_FILE" ]; then CHANGES="$(cat "$NOTES_FILE")"; else CHANGES="_(see the release for the change list)_"; fi
          PR_FILE="notes/pr-list.md"
          if [ -s "$PR_FILE" ]; then PRS="$(cat "$PR_FILE")"; else PRS="_(PR list unavailable)_"; fi
          BODY="$(printf 'Installer to test: %s\n\n### What changed\n%s\n\n### Pull requests in this build\n%s\n\n### To verify\nTest against the live game, then apply a verdict label:\n\n- ✅ **Works** — apply `soak:pass`. Promotes `staging` to `bridge` and cuts a **latest** release.\n- ❌ **Broken** — describe each bug below (steps / expected / actual; add a FakePacketSource repro capture for packet/DPS/decode bugs), then apply `soak:fail`. The build agent fixes forward and a fresh alpha auto-cuts for re-soak.\n\n> While this soak is open, any change merged to `staging` auto-cuts a fresh alpha and supersedes this issue.' \
            "$REL_URL" "$CHANGES" "$PRS")"
          gh label create soak --repo "$GITHUB_REPOSITORY" --color 5319E7 --description "Alpha soak tracking issue" --force >/dev/null 2>&1 || true
          NEW_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "🧪 Alpha soak: v$VERSION" --label soak --body "$BODY")"
          NEW_NUM="${NEW_URL##*/}"
          echo "Opened soak issue #$NEW_NUM ($NEW_URL)."
          # Supersede any OTHER open soak issues (a re-cut replaces the prior soak) so exactly
          # one soak is open at a time — the freeze/thaw (§9.5) keys on that count. Capture the
          # list first (guarded `|| true`): under `set -euo pipefail` a transient `gh issue list`
          # failure inside a `... | while` would fail the step *after* the release published.
          PRIOR_SOAKS="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label soak --json number -q '.[].number' 2>/dev/null || true)"
          for I in $PRIOR_SOAKS; do
            if [ "$I" != "$NEW_NUM" ]; then
              gh issue comment "$I" --repo "$GITHUB_REPOSITORY" --body "Superseded by a fresh alpha soak (v$VERSION, #$NEW_NUM) — \`staging\` moved during the soak." >/dev/null 2>&1 || true
              gh issue close "$I" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            fi
          done
