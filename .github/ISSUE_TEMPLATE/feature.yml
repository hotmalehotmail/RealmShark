name: Feature
description: Propose a new feature or change for an agent to build.
title: "[feature] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this out as the **brief for an autonomous agent** — the agent implements
        from this text with no follow-up questions, so be specific about the *outcome*.

        Describe **what** you want and **why**, not **how**. Which files to change and
        how to build it is the agent's call — you own the goal and the acceptance
        criteria, the agent owns the implementation.

        > A **maintainer** applies the `agent:build` label to dispatch the build agent.
        > This repo is public, so opening an issue on its own triggers nothing.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should exist that doesn't today, and why. Describe the behaviour/outcome, not the code.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Concrete, checkable conditions for "done". These are the yardstick for the
        review agent, any tests, and your alpha soak — vague criteria produce vague builds.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Anything the agent should explicitly NOT do (behaviour, not files).
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / references
      description: >
        Constraints, links, or prior art the agent should be aware of (e.g. upstream
        `tomato`/`potato` branches). Context, not implementation instructions.
    validations:
      required: false
