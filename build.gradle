import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}
sourceCompatibility = 1.8
targetCompatibility = 1.8

project.version = 'v1.2.3'
applicationName = 'RealmShark'

project.ext.lwjglVersion = "3.3.1"
project.ext.jomlVersion = "1.10.5"

switch (org.gradle.internal.os.OperatingSystem.current()) {
    case org.gradle.internal.os.OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = "natives-macos"
        break
    case org.gradle.internal.os.OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break
}

repositories {
    mavenCentral()
    maven {url="https://s01.oss.sonatype.org/content/repositories/snapshots/"}
}

dependencies {
    implementation 'com.ardikars.pcap:pcap-spi:1.4.2'
    implementation 'com.ardikars.pcap:pcap-jdk7:1.4.2'
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation 'com.google.flatbuffers:flatbuffers-java:23.5.26'
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testImplementation 'junit:junit:4.13.2'
}

// Unit tests (src/test/java) — JUnit 4. Start with the pure DPS damage formula.
test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // The baseline-session capture-replay fixture is ~50MB decompressed / 24k envelopes;
    // Gson's JsonElement trees for that many envelopes need more than the default 512MB
    // worker heap (see docs/dps-engine.md, "Capture replay (Java)").
    maxHeapSize = '2g'
}

// Run the WebSocket bridge without disturbing the library's main class.
//   ./gradlew runBridge -Pargs="--fake"
task runBridge(type: JavaExec) {
    group = 'application'
    description = 'Runs the WebSocket bridge (bridge.PacketBridge).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'bridge.PacketBridge'
    if (project.hasProperty('args')) {
        args project.getProperty('args').split('\\s+')
    }
}

// Diagnostic-only entry point: reports whether the enchant pip/per-enchantment
// icon art is reachable in the extraction pipeline, for the follow-up sprite
// feature issue #107 informs. Never starts the bridge server.
//   ./gradlew probeAssets > probe-report.txt
task probeAssets(type: JavaExec) {
    group = 'application'
    description = 'Reports Texture2D/spritesheet/enchantments.xml asset names for enchant pip/icon extraction feasibility (bridge.PacketBridge --probe-assets).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'bridge.PacketBridge'
    args '--probe-assets'
}

// Maintainer-run distiller (issue #189, PRD "Agent Observability" §7.4):
// boils an extracted game XML dump down to the committed facts-only JSON
// (src/main/resources/assets/facts/asset-facts.json). The dump itself is
// private and never committed - rerun this per game update, then commit the
// refreshed facts file.
//   ./gradlew extractFacts -PxmlDir=$HOME/rotmg-assets/xml [-Pbuild=<exalt build id>]
task extractFacts(type: JavaExec) {
    group = 'application'
    description = 'Distills an extracted assets/xml dump into the committed asset-facts.json (assets.facts.AssetFactsExtractor).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'assets.facts.AssetFactsExtractor'
    args '--xml', (findProperty('xmlDir') ?: ''), '--build', (findProperty('build') ?: '')
}

// Self-contained fat jar for just the bridge, so the overlay app can bundle
// and spawn it without the user needing a separate RealmShark build.
//   ./gradlew bridgeJar
task bridgeJar(type: ShadowJar) {
    group = 'application'
    description = 'Builds a self-contained fat jar for the WebSocket bridge (bridge.PacketBridge).'
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    archiveFileName = 'bridge.jar'
    manifest {
        attributes 'Main-Class': 'bridge.PacketBridge'
    }
}

mainClassName = applicationName.toLowerCase() + '.' + applicationName


jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
}

// Ugly solution to get version into source.
task generateSources {
    doFirst {
        def srcFile = new File(file("$buildDir/../src/main/java/" + applicationName.toLowerCase() + "/version"), "Version.java")
        srcFile.parentFile.mkdirs()
        srcFile.write("""package """ + applicationName.toLowerCase() + """.version;
/**
 * Don't edit this class. It's a gradle class to grab version from the build.gradle
 */
public class Version {
    public static final String VERSION = "$project.version";
}

""")
    }
}
compileJava.dependsOn generateSources
compileJava.source generateSources.outputs.files, sourceSets.main.java

/**
 * add to vm optoins
 * "-XstartOnFirstThread"
 */
shadowJar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
    archiveFileName = "${applicationName}-${project.version}.jar"
}

apply plugin: 'com.github.johnrengelman.shadow'